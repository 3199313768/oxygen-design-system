name: Check

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22.22.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Check component documentation and copyable examples
        run: pnpm docs:check

      - name: Lint
        run: pnpm lint

      - name: Verify lint rule enforcement
        run: pnpm test:tooling

      - name: Test coverage surface
        run: pnpm test:surface

      - name: Test with execution coverage thresholds
        run: pnpm test:coverage

      - name: Upload execution coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-coverage
          path: output/coverage/
          retention-days: 14

      - name: Build package
        run: pnpm build

      - name: Build Storybook
        run: pnpm storybook:build-only

      - name: Upload static component documentation
        uses: actions/upload-artifact@v4
        with:
          name: storybook-site
          path: apps/storybook/storybook-static/
          retention-days: 14

      - name: Verify packed consumer
        run: pnpm verify:package

      - name: Upload package size and tree-shaking evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-size-and-tree-shaking
          path: output/package-budgets/
          retention-days: 14

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22.22.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser runtimes
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build static component documentation
        run: pnpm storybook:build
      - name: Verify component documentation in the browser
        run: pnpm verify:docs
      - name: Upload documentation browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-documentation-browser-results
          path: output/playwright/docs/
          retention-days: 14
      - name: Verify complete packed consumer
        run: pnpm verify:workbench
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-consumer-browser-results
          path: output/playwright/consumer/
          retention-days: 14
      - name: Verify Foundation component states in both themes
        run: pnpm verify:foundation
      - name: Upload Foundation state and accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-state-browser-results
          path: output/playwright/foundation/
          retention-days: 14
