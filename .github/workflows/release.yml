name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: oxygen-design-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22.22.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up npm for OIDC publishing
        run: npm install --global npm@11.5.1

      - name: Verify release candidate
        run: pnpm verify && pnpm verify:package

      - name: Check pending changesets
        id: changesets
        run: |
          pnpm changeset status --output output/changesets.json
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { changesets } = JSON.parse(readFileSync('output/changesets.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `pending=${changesets.length > 0}\n`);
          if (changesets.length > 0) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              'Pending changesets: create a maintainer version PR before publishing. See docs/publishing.md.\n');
          }
          JS

      - name: Publish versioned packages
        if: steps.changesets.outputs.pending == 'false'
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
